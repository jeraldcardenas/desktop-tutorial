name: CI

# Run the test suite on pull requests so changes are verified before merge.
# (Pushes to deploy branches are tested inside the Deploy workflow.)
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify the web app builds
        run: npm run build:web
