<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>TalkQuest Mission Proxy</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #FFF6E9; color: #3D3A36;
             display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { background: #fff; padding: 32px 40px; border-radius: 24px; max-width: 420px;
              box-shadow: 0 8px 24px #0001; text-align: center; }
      code { background: #F0E6D6; padding: 2px 6px; border-radius: 6px; }
      a { color: #2DA7AD; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🎒 TalkQuest Mission Proxy</h1>
      <p>This service forwards mission requests to Claude with the API key held
         server-side. It is not a public API.</p>
      <p><code>POST /api/missions</code> &middot; <code>GET /api/health</code></p>
    </div>
  </body>
